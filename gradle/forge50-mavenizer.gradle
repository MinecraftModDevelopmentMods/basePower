import java.security.MessageDigest
import org.gradle.jvm.toolchain.JvmVendorSpec

// Use the same source preparation tool as OreSpawn on Forge 50.
def tool = 'ci-fixtures/tools/minecraft-mavenizer-0.5.21-orespawn-compat.jar'
def defaultJar = project.extensions.extraProperties.has('forge50MavenizerDefault')
        ? project.forge50MavenizerDefault
        : "../../../MinecraftMineralogy/OS1206/OreSpawn/${tool}"
def fixture = file(providers.gradleProperty('forge50MavenizerJar').getOrElse(defaultJar))
def expected = '4B14145595E900F178A082F2253A756F63897E6F61C2B8B5E7C819B82CD79E8C'
if (!fixture.isFile() || MessageDigest.getInstance('SHA-256').digest(fixture.bytes)
        .encodeHex().toString().toUpperCase(Locale.ROOT) != expected) {
    throw new GradleException("Missing or altered Forge 50 Mavenizer fixture: ${fixture}")
}

fgtools.configure('mavenizer') {
    classpath.from(fixture)
    mainClass.set('net.minecraftforge.mcmaven.cli.Main')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    })
}
