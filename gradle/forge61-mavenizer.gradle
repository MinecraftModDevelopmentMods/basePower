import java.security.MessageDigest
import org.gradle.jvm.toolchain.JvmVendorSpec

// Use the same checksum-sealed source preparation tool as OreSpawn on Forge 61.
def tool = 'ci-fixtures/tools/minecraft-mavenizer-0.5.21-orespawn-compat.jar'
def defaultJar = project.extensions.extraProperties.has('forge61MavenizerDefault')
        ? project.forge61MavenizerDefault
        : "../../../MinecraftMineralogy/OS12111/OreSpawn/${tool}"
def fixture = file(providers.gradleProperty('forge61MavenizerJar').getOrElse(defaultJar))
def expected = 'B36CA046DB72E30F27BD38E02B4AE34274ADB51AE1D65BAF9E1D07763755682E'
if (!fixture.isFile() || MessageDigest.getInstance('SHA-256').digest(fixture.bytes)
        .encodeHex().toString().toUpperCase(Locale.ROOT) != expected) {
    throw new GradleException("Missing or altered Forge 61 Mavenizer fixture: ${fixture}")
}
def rules = new File(fixture.parentFile, 'minecraft-source-compatibility.json')
if (!rules.isFile() || MessageDigest.getInstance('SHA-256').digest(rules.bytes)
        .encodeHex().toString().toUpperCase(Locale.ROOT) !=
        '88F2EE4C6B7C903EB1C7D693C0BEEFC0EFC601C1023FB197F7CBA187B1142DB7') {
    throw new GradleException("Missing or altered Forge 61 source-rule manifest: ${rules}")
}

fgtools.configure('mavenizer') {
    classpath.from(fixture)
    mainClass.set('net.minecraftforge.mcmaven.cli.Main')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    })
}
