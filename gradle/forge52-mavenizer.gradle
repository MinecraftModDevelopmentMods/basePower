import java.security.MessageDigest
import org.gradle.jvm.toolchain.JvmVendorSpec

// Use the same source preparation tool as OreSpawn on Forge 52.
def tool = 'ci-fixtures/tools/minecraft-mavenizer-0.5.21-orespawn-compat.jar'
def defaultJar = project.extensions.extraProperties.has('forge52MavenizerDefault')
        ? project.forge52MavenizerDefault
        : "../../../MinecraftMineralogy/OS1211/OreSpawn/${tool}"
def fixture = file(providers.gradleProperty('forge52MavenizerJar').getOrElse(defaultJar))
def expected = '019032A4A26ECB473D403EF017054D5892CE59A9904E8831B452287CD756397E'
if (!fixture.isFile() || MessageDigest.getInstance('SHA-256').digest(fixture.bytes)
        .encodeHex().toString().toUpperCase(Locale.ROOT) != expected) {
    throw new GradleException("Missing or altered Forge 52 Mavenizer fixture: ${fixture}")
}

fgtools.configure('mavenizer') {
    classpath.from(fixture)
    mainClass.set('net.minecraftforge.mcmaven.cli.Main')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    })
}
