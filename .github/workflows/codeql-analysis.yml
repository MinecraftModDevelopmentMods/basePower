name: CodeQL

on:
  push:
    branches: [master-1.21.1-neo, 'feature/**']
  pull_request:
    branches: [master-1.21.1-neo]
  schedule:
    - cron: '47 7 * * 4'

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: basepower-1211-neo-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Power source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Use canonical LF dependency inputs
        run: git config --global core.autocrlf false
      - name: Test native dependency guards
        shell: pwsh
        run: ./.github/test-native-dependencies.ps1
      - name: Require approved public native dependency pins
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/verify-native-dependencies.ps1 -DownloadDirectory "$env:RUNNER_TEMP/power-native-inputs"
      - name: Install Java 21 for Gradle and production
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.7+6.0.LTS'
      - name: Use pinned build toolchain
        run: >-
          echo "MMD_GRADLE_TOOLCHAINS=-Porg.gradle.java.installations.paths=$JAVA_HOME
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.auto-download=false" >> "$GITHUB_ENV"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Compile native production code
        run: |
          chmod +x gradlew
          ./gradlew $MMD_GRADLE_TOOLCHAINS -I .github/pinned-native-inputs.gradle \
            clean classes verifyReleaseDependencies \
            "-PbaseMetalsJar=$BASE_METALS_JAR" "-PmmdlibJar=$MMDLIB_JAR" "-PoreSpawnJar=$ORESPAWN_JAR" \
            --no-daemon --stacktrace
      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
