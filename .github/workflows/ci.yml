name: basePower NeoForge 1.21.1 CI

on:
  push:
    branches: [master-1.21.1-neo, 'feature/**']
  pull_request:
    branches: [master-1.21.1-neo]

permissions:
  contents: read

concurrency:
  group: basepower-1211-neo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Power source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Use canonical LF dependency inputs
        run: git config --global core.autocrlf false
      - name: Test native dependency guards
        shell: pwsh
        run: ./.github/test-native-dependencies.ps1
      - name: Require approved public native dependency pins
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/verify-native-dependencies.ps1 -DownloadDirectory "$env:RUNNER_TEMP/power-native-inputs"
      - name: Install Java 21 for Gradle and production
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.7+6.0.LTS'
      - name: Use pinned build toolchain
        run: >-
          echo "MMD_GRADLE_TOOLCHAINS=-Porg.gradle.java.installations.paths=$JAVA_HOME
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.auto-download=false" >> "$GITHUB_ENV"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Build and audit native candidate
        run: |
          chmod +x gradlew
          ./gradlew $MMD_GRADLE_TOOLCHAINS -I .github/pinned-native-inputs.gradle \
            clean check build javadoc verifyReleaseDependencies verifyReleaseArtifacts \
            writeReleaseChecksums verifyEclipseProductionClasspath \
            "-PbaseMetalsJar=$BASE_METALS_JAR" "-PmmdlibJar=$MMDLIB_JAR" "-PoreSpawnJar=$ORESPAWN_JAR" \
            --no-daemon --stacktrace
      - name: Upload CI build, not release approval
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: basePower-1.21.1-neo-${{ github.sha }}-unapproved
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/basePower-${{ env.POWER_VERSION }}.jar
            build/libs/basePower-${{ env.POWER_VERSION }}-sources.jar
            build/libs/basePower-${{ env.POWER_VERSION }}-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.txt
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: basePower-1211-neo-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
      - name: Record remaining local delivery gates
        if: always()
        shell: pwsh
        run: |
          'Dependency inputs are public and hash-pinned. Hosted checks do not replace packaged gameplay, migration, endurance, rendered-client checks or manual acceptance.' | Add-Content $env:GITHUB_STEP_SUMMARY
