name: basePower 1.20.6 CI

on:
  push:
    branches: [master-1.20.6, 'feature/**']
  pull_request:
    branches: [master-1.20.6]

permissions:
  contents: read

concurrency:
  group: basepower-1.20.6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out PowerAdvantage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check out pinned OreSpawn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/OreSpawn
          ref: 4085315345ff043448b316d75e03f4b8da45402d
          path: .ci-dependencies/OreSpawn
      - name: Use canonical LF dependency inputs
        # Use the same source bytes on hosted and local dependency builds.
        run: git config --global core.autocrlf false
      - name: Check out pinned Base Metals
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/BaseMetals
          ref: 9e706db5c85fa2bc7f36dee94f39a5f2fa8ab367
          path: .ci-dependencies/BaseMetals
      - name: Install pinned Java 25 Mavenizer runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Install Java 8 launcher helper
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'
      - name: Install Java 21 for Gradle and production
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.7+6.0.LTS'
      - name: Use pinned build toolchains
        # These are Gradle project properties, not JVM system properties.
        shell: bash
        run: >-
          echo "MMD_GRADLE_TOOLCHAINS=-Porg.gradle.java.installations.paths=$JAVA_HOME,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.auto-download=false" >> "$GITHUB_ENV"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Build pinned development dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          orespawn="$GITHUB_WORKSPACE/.ci-dependencies/OreSpawn"
          basemetals="$GITHUB_WORKSPACE/.ci-dependencies/BaseMetals"
          mavenizer="$orespawn/ci-fixtures/tools/minecraft-mavenizer-0.5.21-orespawn-compat.jar"
          mirror="$RUNNER_TEMP/orespawn-mirror"
          bash "$basemetals/gradle/stage-orespawn-release.sh" "$mirror"
          chmod +x "$orespawn/gradlew" "$basemetals/gradlew"
          (cd "$orespawn" && ./gradlew $MMD_GRADLE_TOOLCHAINS jar --no-daemon --stacktrace)
          (cd "$basemetals" && ./gradlew $MMD_GRADLE_TOOLCHAINS jar -PorespawnVerificationRepository="$mirror" --no-daemon --stacktrace)
          osjar="$orespawn/build/libs/OreSpawn-4.1.0.120061.jar"
          bmjar="$basemetals/build/libs/BaseMetals-3.1.2.120061.jar"
          test -f "$osjar" && test -f "$bmjar"
          echo "orespawn=$osjar" >> "$GITHUB_OUTPUT"
          echo "basemetals=$bmjar" >> "$GITHUB_OUTPUT"
          echo "mavenizer=$mavenizer" >> "$GITHUB_OUTPUT"
      - name: Build and audit release artifacts
        run: >-
          ./gradlew $MMD_GRADLE_TOOLCHAINS clean check build javadoc verifyReleaseDependencies verifyReleaseArtifacts
          writeReleaseChecksums verifyEclipseProductionClasspath
          -PbaseMetalsDeobfJar=${{ steps.dependencies.outputs.basemetals }}
          -PoreSpawnDeobfJar=${{ steps.dependencies.outputs.orespawn }}
          -Pforge50MavenizerJar=${{ steps.dependencies.outputs.mavenizer }}
          --no-daemon --stacktrace
      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: basePower-1.20.6-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/basePower-2.4.13.120061.jar
            build/libs/basePower-2.4.13.120061-sources.jar
            build/libs/basePower-2.4.13.120061-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.txt
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: basePower-1.20.6-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
            build/*-run/logs/**
            build/problems/**
