import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.util.zip.ZipFile
import org.apache.tools.ant.filters.FixCrLfFilter

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = mod_group
version = mod_version
base.archivesName = 'basePower'
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}
tasks.withType(Javadoc).configureEach {
    failOnError = true
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    includeEmptyDirs = false
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.moddev.zone/releases' }
}
configurations {
    pinnedBaseMetals { canBeConsumed = false; transitive = false }
    implementation.extendsFrom pinnedBaseMetals
}
def baseMetalsOverride = providers.gradleProperty('baseMetalsJar')
def baseMetalsJar = providers.provider { configurations.pinnedBaseMetals.singleFile }
def expansionJars = [
    basesteam: file(providers.gradleProperty('steamAdvantageDeobfJar')
            .getOrElse('../SteamAdvantage/SteamAdvantage/build/libs/baseSteam-2.2.20.121012.jar')),
    baseelectric: file(providers.gradleProperty('electricAdvantageDeobfJar')
            .getOrElse('../ElectricAdvantage/ElectricAdvantage/build/libs/baseElectric-2.2.20.121012.jar'))
]
dependencies {
    if (baseMetalsOverride.isPresent()) {
        pinnedBaseMetals files(baseMetalsOverride.get())
    } else {
        pinnedBaseMetals 'zone.moddev.mc.basemetals:BaseMetals:' + basemetals_version
    }
    implementation 'zone.moddev.mc.lib:mmdlib:' + mmdlib_version
    implementation 'zone.moddev.mc.orespawn:OreSpawn:' + orespawn_version
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets {
    main.resources { srcDir 'src/generated/resources'; exclude '.cache/**' }
    test.java.srcDir 'test-rig/unit-support'
}
neoForge {
    version = neo_version
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))
    runs {
        client {
            client()
            gameDirectory = file(providers.gradleProperty('powerAdvantageRunDirectory').getOrElse('run'))
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = file(providers.gradleProperty('powerAdvantageRunDirectory').getOrElse('run-server'))
        }
        clientAllAdvantage {
            client()
            gameDirectory = file(providers.gradleProperty('powerAdvantageRunDirectory').getOrElse('run-all-advantage'))
        }
        clientResourceCheck {
            client()
            gameDirectory = file(providers.gradleProperty('clientResourceRunDirectory').getOrElse('build/client-resources/native'))
            jvmArguments.addAll '-Dadvantageworks.clientResources=true', '-Dadvantageworks.requireExtensions=true',
                    '-Dadvantageworks.machineGuiLayouts=true', '-Dadvantageworks.childRendererGeometry=true',
                    '-XX:ActiveProcessorCount=4'
        }
        data {
            data()
            gameDirectory = file('run-data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }
    mods { basepower { sourceSet sourceSets.main } }
    unitTest {
        enable()
        testedMod = mods.basepower
    }
}
neoForge.addModdingDependenciesTo(sourceSets.test)
tasks.named('test', Test) {
    useJUnitPlatform()
    maxHeapSize = '2G'
    maxParallelForks = 1
    workingDir projectDir
    doFirst { workingDir projectDir }
    systemProperty 'advantage.test.projectDir', projectDir.absolutePath
    jvmArgs '-XX:ActiveProcessorCount=4'
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
}
tasks.named('processResources', ProcessResources) {
    inputs.properties(version: project.version, neo_version: project.neo_version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version, neo_version: project.neo_version
    }
    filesMatching(['**/*.json','**/*.toml','**/*.cfg','**/*.js','**/*.properties']) {
        filter(FixCrLfFilter, eol: FixCrLfFilter.CrLf.newInstance('lf'))
    }
}
tasks.named('jar', Jar) {
    manifest.attributes(
            'Implementation-Title': 'basePower',
            'Implementation-Version': project.version,
            'Built-On-Java': '21',
            'Built-On': minecraft_version + '-NeoForge-' + neo_version)
}

tasks.named('sourcesJar', Jar) {
    filesMatching(['**/*.java', '**/*.json', '**/*.toml', '**/*.cfg', '**/*.properties', '**/*.mcmeta', '**/*.js']) {
        filter(FixCrLfFilter, eol: FixCrLfFilter.CrLf.newInstance('lf'))
    }
}
tasks.register('deobfJar') { dependsOn tasks.named('jar') }
def sha256 = { File f -> MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString().toUpperCase(Locale.ROOT) }
tasks.register('verifyReleaseDependencies') {
    doLast {
        if (!baseMetalsJar.get().isFile()) throw new GradleException('Missing pinned Base Metals jar: ' + baseMetalsJar.get())
        if (!project.basemetals_deobf_sha256.matches('[A-Fa-f0-9]{64}')
                || sha256(baseMetalsJar.get()) != project.basemetals_deobf_sha256.toUpperCase(Locale.ROOT))
            throw new GradleException('Base Metals must match its recorded public SHA-256')
        def archives = configurations.runtimeClasspath.files.findAll { it.name.endsWith('.jar') }
        [mmdlib: project.mmdlib_sha256, OreSpawn: project.orespawn_deobf_sha256].each { name, hash ->
            def matches = archives.findAll { it.name.startsWith(name + '-') }
            if (matches.size() != 1 || sha256(matches[0]) != hash.toUpperCase(Locale.ROOT))
                throw new GradleException('Missing or changed pinned runtime: ' + name)
        }
        if (archives.any { it.name.toLowerCase(Locale.ROOT).matches('.*(reborncore|rf-api|tesla|forge-1\\.21).*') })
            throw new GradleException('Obsolete Forge dependencies leaked into NeoForge runtime')
    }
}
tasks.register('verifyReleaseConfiguration') {
    doLast {
        if (project.minecraft_version != '1.21.1' || project.loader_name != 'neoforge'
                || project.loader_code != '2' || !project.mod_version.endsWith('.121012'))
            throw new GradleException('Incorrect NeoForge 1.21.1 release identity')
        def pack = new JsonSlurper().parse(file('src/main/resources/pack.mcmeta')).pack
        if (pack.pack_format != 34) throw new GradleException('Incorrect 1.21.1 pack format')
        def forbidden = fileTree('src/main/java').matching { include '**/*.java' }.files.findAll {
            it.text.contains('net.minecraftforge.')
        }
        if (forbidden) throw new GradleException('Forge imports remain: ' + forbidden)
    }
}
tasks.register('verifyReleaseArtifacts') {
    dependsOn tasks.named('assemble'), tasks.named('verifyReleaseDependencies'), tasks.named('verifyReleaseConfiguration')
    doLast {
        def expected = ['', '-sources', '-javadoc'].collect { 'basePower-' + version + it + '.jar' }.sort()
        def actual = fileTree('build/libs').matching { include '*.jar' }.files.collect { it.name }.sort()
        if (actual != expected) throw new GradleException('Unexpected release archives: ' + actual)
        new ZipFile(file('build/libs/basePower-' + version + '.jar')).withCloseable { zip ->
            def names = zip.entries().collect { it.name }
            if (!names.contains('META-INF/neoforge.mods.toml')
                    || !names.contains('cyano/poweradvantage/api/fluid/FluidNetworkApi.class'))
                throw new GradleException('Release metadata or legacy public API missing')
            def rejected = names.findAll {
                it.startsWith('net/') || it.startsWith('zone/moddev/mc/lib/')
                        || it.startsWith('zone/moddev/mc/basemetals/') || it.startsWith('zone/moddev/mc/orespawn/')
                        || it.contains('advantageworks') || it.contains('agent-notes') || it.endsWith('AGENTS.md')
                        || it.startsWith('build/') || it.endsWith('.launch') || it.contains('/.cache/')
                        || it.startsWith('data/forge/loot_modifiers/')
            }
            if (rejected) throw new GradleException('Forbidden archive contents: ' + rejected)
            zip.entries().findAll { it.name.endsWith('.class') }.each { entry ->
                byte[] bytes = zip.getInputStream(entry).readNBytes(8)
                if (bytes.length != 8 || ((bytes[6] & 255) << 8 | (bytes[7] & 255)) != 65)
                    throw new GradleException('Non-Java21 class: ' + entry.name)
            }
        }
    }
}
tasks.register('writeReleaseChecksums') {
    dependsOn tasks.named('verifyReleaseArtifacts')
    doLast {
        def jars = fileTree('build/libs').matching { include '*.jar' }.files.sort { it.name }
        String sums = jars.collect { sha256(it) + '  ' + it.name + '\n' }.join('')
        file('build/libs/SHA256SUMS').text = sums
        file('build/release').mkdirs()
        file('build/release/SHA256SUMS').text = sums
    }
}
tasks.register('verifyJavaPackageLayout') {
    doLast {
        fileTree('src').matching { include '**/java/**/*.java' }.files.each { f ->
            def match = f.text =~ /(?m)^package\s+([\w.]+);/
            if (!match.find() || !f.path.replace('\\','/').endsWith('/' + match.group(1).replace('.','/') + '/' + f.name))
                throw new GradleException('Source package/path mismatch: ' + f)
        }
    }
}
eclipse {
    project {
        name = 'PowerAdvantage'
        buildCommand 'org.eclipse.buildship.core.gradleprojectbuilder'
        natures 'org.eclipse.buildship.core.gradleprojectnature'
    }
    classpath {
        defaultOutputDir = file('bin/main')
        file.whenMerged { cp ->
            // Buildship merges the existing .classpath on every refresh.
            cp.entries.removeAll { it instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder
                    && it.path in ['src/main/resources', 'src/generated/resources', 'build/resources/main'] }
            cp.entries.add(new org.gradle.plugins.ide.eclipse.model.SourceFolder('build/resources/main', 'bin/main'))
            cp.entries.findAll { it.kind == 'src' }.each { entry ->
                boolean tests = entry.path.startsWith('src/test/') || entry.path.startsWith('test-rig/unit-support')
                entry.output = tests ? 'bin/test' : 'bin/main'
                if (tests) entry.entryAttributes['test'] = 'true'
            }
        }
    }
}

def prepareEclipseResources = tasks.register('prepareEclipseResources', Copy) {
    dependsOn tasks.named('processResources')
    from layout.buildDirectory.dir('resources/main')
    into 'bin/main'
}
neoForge.ideSyncTask prepareEclipseResources
tasks.named('eclipseClasspath') { dependsOn tasks.named('processResources') }
tasks.register('configureEclipseBuildship') {
    doLast {
        File prefs = file('.settings/org.eclipse.buildship.core.prefs')
        prefs.parentFile.mkdirs()
        Properties settings = new Properties()
        ['eclipse.preferences.version': '1',
         'connection.gradle.distribution': 'GRADLE_DISTRIBUTION(WRAPPER)',
         'connection.gradle.user.home': gradle.gradleUserHomeDir.canonicalPath,
         'gradle.user.home': gradle.gradleUserHomeDir.canonicalPath,
         'java.home': javaToolchains.launcherFor(java.toolchain).get().metadata.installationPath.asFile.canonicalPath,
         'override.workspace.settings': 'true', 'connection.project.dir': ''].each { key, value -> settings.setProperty(key, value) }
        prefs.withOutputStream { settings.store(it, 'Generated by configureEclipseBuildship') }
    }
}
tasks.named('eclipse') { dependsOn 'configureEclipseBuildship', prepareEclipseResources }
tasks.register('verifyEclipseProductionClasspath') {
    dependsOn tasks.named('eclipse'), tasks.named('verifyJavaPackageLayout')
    doLast {
        def xml = new groovy.xml.XmlSlurper().parse(file('.classpath'))
        if (!xml.classpathentry.any { it.@kind.text() == 'src' && it.@path.text() == 'src/main/java' })
            throw new GradleException('Eclipse production source root missing')
        if (xml.classpathentry.any { it.@path == 'src/main/resources' }
                || !xml.classpathentry.any { it.@path == 'build/resources/main' && it.@output == 'bin/main' })
            throw new GradleException('Eclipse must use processed production resources')
        xml.classpathentry.findAll { it.@kind == 'src' }.each {
            boolean tests = it.@path.text().startsWith('src/test/') || it.@path.text().startsWith('test-rig/unit-support')
            if (it.@output.text() != (tests ? 'bin/test' : 'bin/main'))
                throw new GradleException('Mixed Eclipse production/test output')
        }
        xml.classpathentry.findAll { it.@kind == 'lib' }.each {
            if (!file(it.@path.text()).isFile()) throw new GradleException('Missing Eclipse dependency: ' + it.@path)
        }
        String metadata = file('bin/main/META-INF/neoforge.mods.toml').text
        if (!metadata.contains('version="' + project.mod_version + '"') || metadata.contains('${'))
            throw new GradleException('Eclipse metadata was not expanded')
        if (!xml.classpathentry.any { it.@path.text().contains('JavaSE-21') })
            throw new GradleException('Eclipse must use Java 21')
    }
}
tasks.register('prepareCombinedEclipseLaunch') {
    dependsOn tasks.named('verifyEclipseProductionClasspath')
    doLast { expansionJars.each { id, f -> if (!f.isFile()) throw new GradleException('Build expansion first: ' + id) } }
}
publishing {
    publications { mavenJava(MavenPublication) {
        from components.java
        artifactId = 'basePower'
        pom { name = 'basePower'; description = project.mod_description
            licenses { license { name = 'LGPL-3.0-only'; url = 'https://www.gnu.org/licenses/lgpl-3.0.html' } } }
    } }
}
tasks.register('verifyModelAssets') {
    group = 'verification'
    description = 'Verifies that PowerAdvantage model references resolve to packaged assets.'
    File resourceRoot = file('src/main/resources')
    File modelRoot = new File(resourceRoot, "assets/${project.mod_id}/models")
    File blockstateRoot = new File(resourceRoot, "assets/${project.mod_id}/blockstates")
    inputs.dir(modelRoot)
    inputs.dir(blockstateRoot)

    doLast {
        Set<String> vanillaAssets = [] as Set<String>
        configurations.runtimeClasspath.files.findAll {
            it.name.contains('client-extra') && it.name.endsWith('.jar')
        }.each { File archive ->
            new ZipFile(archive).withCloseable { zip ->
                zip.entries().each { entry -> vanillaAssets.add(entry.name) }
            }
        }
        def atlas = new JsonSlurper().parse(new File(resourceRoot, 'assets/minecraft/atlases/blocks.json'))
        def verifyReference = { String reference, String assetType, String sourcePath ->
            if (reference.startsWith('#')) return
            int separator = reference.indexOf(':')
            String namespace = separator >= 0 ? reference.substring(0, separator) : 'minecraft'
            String path = separator >= 0 ? reference.substring(separator + 1) : reference
            if (namespace == 'minecraft') {
                if (assetType == 'models' && path.startsWith('builtin/')) return
                String suffix = assetType == 'textures' ? '.png' : '.json'
                if (!vanillaAssets.contains("assets/minecraft/${assetType}/${path}${suffix}".toString())) {
                    throw new GradleException("${sourcePath} references missing vanilla ${assetType} asset ${reference}")
                }
                return
            }
            if (namespace != project.mod_id) return

            File target = new File(resourceRoot,
                    "assets/${namespace}/${assetType}/${path}.json")
            if (assetType == 'textures') {
                target = new File(resourceRoot, "assets/${namespace}/textures/${path}.png")
                if (!atlas.sources.any { it.type == 'directory' && it.prefix == it.source + '/'
                        && path.startsWith(it.prefix as String) }) {
                    throw new GradleException("${sourcePath} references texture ${reference} outside the block atlas")
                }
            }
            if (!target.isFile()) {
                throw new GradleException(
                        "${sourcePath} references missing ${assetType} asset ${reference}")
            }
        }

        fileTree(modelRoot) { include '**/*.json' }.files.sort().each { File modelFile ->
            def model = new JsonSlurper().parse(modelFile)
            if (model.parent instanceof String) {
                verifyReference(model.parent, 'models', modelFile.path)
            }
            if (model.textures instanceof Map) {
                model.textures.values().findAll { it instanceof String }.each { String texture ->
                    verifyReference(texture, 'textures', modelFile.path)
                }
            }
        }

        Closure verifyBlockstateModels
        verifyBlockstateModels = { Object node, String sourcePath ->
            if (node instanceof Map) {
                node.each { key, value ->
                    if (key == 'model' && value instanceof String) {
                        verifyReference(value, 'models', sourcePath)
                    } else {
                        verifyBlockstateModels(value, sourcePath)
                    }
                }
            } else if (node instanceof Collection) {
                node.each { verifyBlockstateModels(it, sourcePath) }
            }
        }
        fileTree(blockstateRoot) { include '**/*.json' }.files.sort().each { File blockstateFile ->
            def blockstate = new JsonSlurper().parse(blockstateFile)
            if (blockstate.containsKey('forge_marker')
                    || blockstate.variants?.containsKey('normal') || blockstate.variants?.containsKey('fluid')) {
                throw new GradleException("${blockstateFile.path} uses a removed legacy blockstate format")
            }
            verifyBlockstateModels(blockstate, blockstateFile.path)
        }
    }
}

tasks.register('verifyRecipeTagGuards') {
    group = 'verification'
    description = 'Rejects recipes that can collapse when a shared material tag is empty.'
    File recipeRoot = file("src/main/resources/data/${project.mod_id}/recipe")
    inputs.dir(recipeRoot)
    doLast {
        Closure collectTags
        collectTags = { Object node, Set<String> tags ->
            if (node instanceof Map) {
                node.each { key, value ->
                    if (key == 'neoforge:conditions' || key == 'result') return
                    if (key == 'tag' && value instanceof String && (value.startsWith('c:') || value.startsWith('forge:'))) {
                        tags.add(value)
                    } else {
                        collectTags(value, tags)
                    }
                }
            } else if (node instanceof Collection) {
                node.each { collectTags(it, tags) }
            }
        }
        Closure requiredConditions
        requiredConditions = { Object node, String path ->
            if (!(node instanceof Map) || !(node.type instanceof String)) {
                throw new GradleException("${path} contains an invalid NeoForge recipe condition")
            }
            if (node.type != 'neoforge:and') return [node]
            if (!(node.values instanceof Collection) || node.values.isEmpty()) {
                throw new GradleException("${path} contains an empty Forge conjunction")
            }
            node.values.collectMany { requiredConditions(it, path) }
        }
        fileTree(recipeRoot) { include '**/*.json' }.files.sort().each { File recipeFile ->
            Map recipe = new JsonSlurper().parse(recipeFile) as Map
            Set<String> tags = [] as Set<String>
            collectTags(recipe, tags)
            if (recipe.containsKey('conditions') || recipe.containsKey('forge:condition')) {
                throw new GradleException("${recipeFile.path} uses legacy recipe conditions")
            }
            List conditions = recipe.containsKey('neoforge:conditions')
                    ? recipe['neoforge:conditions'].collectMany { requiredConditions(it, recipeFile.path) } : []
            Set<String> guards = conditions
                    .findAll { it instanceof Map && it.type == 'basepower:tag_not_empty' }
                    .collect { it.tag as String } as Set<String>
            Set<String> emptyGuards = conditions.findAll { it.type == 'basepower:tag_empty' }
                    .collect { it.tag as String } as Set<String>
            if (!(emptyGuards.intersect(guards)).isEmpty()) {
                throw new GradleException("${recipeFile.path} requires the same tag to be empty and nonempty")
            }
            Set<String> missing = tags - guards
            if (!missing.isEmpty()) {
                throw new GradleException("${recipeFile.path} lacks tag_not_empty guards for ${missing.sort()}")
            }
        }
    }
}


tasks.named('check') {
    dependsOn tasks.named('verifyReleaseConfiguration'), tasks.named('verifyJavaPackageLayout'),
            tasks.named('verifyModelAssets'), tasks.named('verifyRecipeTagGuards')
}
def compileClientResourceProbe = tasks.register('compileClientResourceProbe', JavaCompile) {
    dependsOn tasks.named('classes')
    source fileTree('test-rig/client-resources/java')
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDirectory = layout.buildDirectory.dir('client-resource-probe/classes')
}
tasks.register('clientResourceProbeJar', Jar) {
    dependsOn compileClientResourceProbe
    archiveFileName = 'advantageclientresources-deobf.jar'
    destinationDirectory = layout.buildDirectory.dir('client-resource-probe')
    from compileClientResourceProbe.flatMap { it.destinationDirectory }
    from 'test-rig/client-resources/resources'
}
def stageDevelopmentMods = { String name, run, boolean probe ->
    tasks.register(name, Copy) {
        if (probe) dependsOn tasks.named('clientResourceProbeJar')
        from expansionJars.values()
        if (probe) from tasks.named('clientResourceProbeJar', Jar).flatMap { it.archiveFile }
        into run.gameDirectory.dir('mods')
        doFirst {
            expansionJars.each { id, jar -> if (!jar.isFile()) throw new GradleException('Build expansion first: ' + id) }
            Set<String> managed = expansionJars.values().collect { it.name } as Set<String>
            if (probe) managed.add('advantageclientresources-deobf.jar')
            def unexpected = fileTree(run.gameDirectory.dir('mods')).matching { include '*.jar' }.files
                    .findAll { !managed.contains(it.name) }
            if (unexpected) throw new GradleException('Unmanaged development mods; choose a fresh run directory: ' + unexpected)
        }
    }
}
neoForge.runs.clientAllAdvantage.taskBefore(stageDevelopmentMods('stageCombinedDevelopmentMods', neoForge.runs.clientAllAdvantage, false))
neoForge.runs.clientResourceCheck.taskBefore(stageDevelopmentMods('stageClientResourceMods', neoForge.runs.clientResourceCheck, true))

apply from: 'gradle/verify-eclipse-ecj.gradle'

apply from: 'gradle/client-integration.gradle'
