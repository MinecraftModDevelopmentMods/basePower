}

tasks.register('writeNative263CompileContract') {
    group = 'verification'
    dependsOn tasks.named('verifyWorksCompileInputPin'), unitBootstrapJar
    doLast {
        def sets = [sourceSets.main, sourceSets.runner, sourceSets.test, sourceSets.clientProbe, sourceSets.clientProbeTest]
        def sha = { File input -> java.security.MessageDigest.getInstance('SHA-256')
                .digest(input.bytes).encodeHex().toString().toUpperCase(Locale.ROOT) }
        def sources = sets.collectMany { it.allJava.files }.unique().sort { it.absolutePath }
        def jars = sets.collectMany { it.compileClasspath.files }.findAll { it.isFile() && it.name.endsWith('.jar') }
                .unique().sort { it.absolutePath }
        def result = [engineProtocol: 'NATIVE66', qualificationAllowed: false,
                powerSha256: powerCompileSha.get(),
                sourceFiles: sources.collect { [path: it.absolutePath, sha256: sha(it)] },
                classpath: jars.collect { [path: it.absolutePath, sha256: sha(it)] }]
        File output = layout.buildDirectory.file('native263-compile-contract.json').get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(result)) + '\n'
    }
}
