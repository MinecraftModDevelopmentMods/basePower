import org.apache.tools.ant.filters.FixCrLfFilter

plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

ext.forge64MavenizerDefault = '../../../../MinecraftMineralogy/OS263/OreSpawn/ci-fixtures/tools/minecraft-mavenizer-0.5.21-orespawn-compat.jar'
apply from: '../gradle/forge64-mavenizer.gradle'

// Saves, pinned inputs and evidence are siblings, never Gradle cleanup targets.
layout.buildDirectory = layout.projectDirectory.dir('build/gradle')
tasks.named('clean', Delete) {
    doFirst {
        File expected = file('build/gradle').canonicalFile
        if (layout.buildDirectory.get().asFile.canonicalFile != expected
                || targetFiles.files.any { it.canonicalFile != expected }) {
            throw new GradleException('Refusing to clean outside the isolated harness compiler output')
        }
    }
}

group = 'zone.moddev.mc.advantageworks'
version = project.harness_version
base.archivesName = 'AdvantageWorksTestHarness'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

sourceSets {
    main.java.srcDir 'shared-probe'
    test.java.srcDir 'unit-support'
    // Preserve the 1.15 source oracle; its native 1.16 API copy runs instead.
    test.java.exclude '**/NativeHarvestIsolationTest.java'
    runner {
        java.srcDir 'src/runner/java'
        resources.srcDir 'src/runner/resources'
    }
    clientProbe {
        java.srcDir 'client-resources/java'
        resources.srcDir 'client-resources/resources'
        compileClasspath += sourceSets.main.compileClasspath
    }
    clientProbeTest {
        java.srcDir 'client-resources/test'
        compileClasspath += sourceSets.clientProbe.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.clientProbe.output + sourceSets.main.compileClasspath
    }
}

configurations.clientProbeTestImplementation.extendsFrom(configurations.testImplementation)

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net/'
    }
}

def powerCompileJar = file(project.findProperty('powerAdvantageReleaseJar')
        ?: '../build/libs/basePower-2.4.18.2603001.jar')
def exploratoryPowerSha = providers.gradleProperty('worksExploratoryPowerSha256')
def powerCompileSha = exploratoryPowerSha.orElse(providers.gradleProperty('works_power_sha256'))

dependencies {
    implementation minecraft.dependency(
            "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    runnerImplementation 'com.google.code.gson:gson:2.8.0'
    testImplementation sourceSets.runner.output
    testImplementation 'junit:junit:4.13.2'
    compileOnly files(powerCompileJar)
    testRuntimeOnly files(powerCompileJar)
}

def compileUnitBootstrap = tasks.register('compileUnitBootstrap', JavaCompile) {
    source fileTree('unit-bootstrap')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('unit-bootstrap/classes')
}
def unitBootstrapJar = tasks.register('unitBootstrapJar', Jar) {
    dependsOn compileUnitBootstrap
    archiveFileName = 'forge-native-unit-bootstrap.jar'
    destinationDirectory = layout.buildDirectory.dir('unit-bootstrap')
    from compileUnitBootstrap.flatMap { it.destinationDirectory }
    manifest.attributes('Premain-Class': 'zone.moddev.mc.advantageworks.unit.ForgeCapabilityBootstrap')
}
tasks.withType(Test).configureEach {
    maxHeapSize = '2G'
    dependsOn unitBootstrapJar
    doFirst { jvmArgs "-javaagent:${unitBootstrapJar.get().archiveFile.get().asFile}" }
}

tasks.register('verifyWorksCompileInputPin') {
    group = 'verification'
    description = 'Checks the exact parent-supplied Power API artifact before harness compilation.'
    inputs.file(powerCompileJar)
    inputs.property('powerSha256', powerCompileSha.orElse(''))
    doLast {
        if (!powerCompileJar.isFile()) throw new GradleException("Missing 26.3 Power compile input: ${powerCompileJar}")
        if (!(powerCompileSha.getOrElse('') ==~ /[A-Fa-f0-9]{64}/)) {
            throw new GradleException('Missing or invalid Power SHA-256 pin')
        }
        String actual = java.security.MessageDigest.getInstance('SHA-256')
                .digest(powerCompileJar.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
        if (!actual.equalsIgnoreCase(powerCompileSha.get())) {
            throw new GradleException("Power compile input changed: ${actual}; obtain a new parent pin")
        }
        String status = exploratoryPowerSha.isPresent() ? 'EXPLORATORY_UNQUALIFIED' : 'Pinned'
        logger.lifecycle("${status} Power compile/runtime input: ${actual}")
    }
}

tasks.named('compileJava') { dependsOn tasks.named('verifyWorksCompileInputPin') }
tasks.named('compileClientProbeJava') { dependsOn tasks.named('verifyWorksCompileInputPin') }

tasks.named('test', Test) {
    def temp = layout.buildDirectory.dir('test-temp')
    doFirst { temp.get().asFile.mkdirs() }
    systemProperty 'java.io.tmpdir', temp.get().asFile.absolutePath
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.property('version', project.version)
    inputs.property('mcversion', project.minecraft_version)
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
    filesMatching(['**/*.json', '**/*.info', '**/*.properties', '**/*.md']) {
        filter(FixCrLfFilter,
                eol: FixCrLfFilter.CrLf.newInstance('lf'),
                eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'))
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Implementation-Title': base.archivesName.get(),
                'Implementation-Version': project.version,
                'Built-On': "${project.minecraft_version}-${project.forge_version}",
                'Power-Input-Status': 'EXPLORATORY_UNQUALIFIED',
                'Power-Input-SHA256': powerCompileSha.getOrElse('').toUpperCase(Locale.ROOT)
        ])
    }
}

tasks.named('processRunnerResources', ProcessResources) {
    from('src/main/resources') {
        include 'assets/advantageworkstest/works/flat-generator.json'
    }
}

tasks.register('runnerJar', Jar) {
    dependsOn tasks.named('runnerClasses')
    archiveClassifier = 'runner'
    from sourceSets.runner.output
    manifest.attributes('Main-Class': 'zone.moddev.mc.advantageworks.runner.WorksRunner')
}

tasks.named('assemble') {
    dependsOn tasks.named('runnerJar')
}

def configurePreparedSeedArgs = { JavaExec task ->
    def options = [
            worksServerSeed: '--prepared-server-seed',
            worksServerInventory: '--prepared-server-seed-inventory',
            worksServerInventorySha256: '--prepared-server-seed-sha256'
    ]
    options.each { key, option ->
        if (project.hasProperty(key)) {
            String value = project.property(key).toString()
            task.args option, key.endsWith('Sha256') ? value : file(value).absolutePath
        }
    }
}

def registerWorksRunner = { String taskName, String profileName, boolean automated, String taskDescription ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = taskDescription
        dependsOn tasks.named('jar')
        dependsOn tasks.named('runnerClasses')
        classpath = sourceSets.runner.runtimeClasspath
        mainClass = 'zone.moddev.mc.advantageworks.runner.WorksRunner'
        if (!automated) standardInput = System.in
        doFirst { JavaExec task ->
            String pin = providers.gradleProperty('worksProfileFile').orNull
            if (!pin) throw new GradleException("Generate the pinned ${profileName} profile with migration/native12111.py profile and set -PworksProfileFile")
            File profile = file(pin)
            if (new groovy.json.JsonSlurper().parse(profile).name != profileName) {
                throw new GradleException("Expected profile ${profileName}: ${profile}")
            }
            args '--profile', profile.absolutePath
            configurePreparedSeedArgs(task)
        }
        if (automated) args '--automated'
        if (project.hasProperty('worksStations')) {
            args '--stations', project.property('worksStations').toString()
        }
        if (project.hasProperty('worksRunSeconds')) {
            args '--run-seconds', project.property('worksRunSeconds').toString()
        }
        if (project.hasProperty('worksServerPort')) {
            args '--server-port', project.property('worksServerPort').toString()
        }
    }
}

