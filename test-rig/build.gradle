tasks.register('clientProbeJar', Jar) {
    dependsOn tasks.named('clientProbeClasses')
    archiveFileName = 'AdvantageClientResourceProbe-native263.jar'
    from sourceSets.clientProbe.output
    manifest.attributes('Built-On': "${project.minecraft_version}-${project.forge_version}",
