import java.security.MessageDigest
plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'zone.moddev.mc.advantageworks'
version = harness_version
base.archivesName = 'AdvantageWorksTestHarness'
// Generated worlds and sealed evidence are siblings, never clean-task targets.
layout.buildDirectory = layout.projectDirectory.dir('build/gradle')
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets {
    main.java.srcDir 'shared-probe'
    test.java.srcDir 'unit-support'
    test.java.srcDir 'src/runner/java'
    // Retain the historical 1.15 oracle; Native117HarvestIsolationTest runs its native counterpart.
    test.java.exclude '**/NativeHarvestIsolationTest.java'
    runner { java.srcDir 'src/runner/java'; resources.srcDir 'src/runner/resources' }
}
repositories { mavenCentral(); maven { url = 'https://maven.moddev.zone/releases' } }
def powerJar = file(providers.gradleProperty('powerAdvantageReleaseJar')
        .getOrElse('../build/libs/basePower-2.4.19.121012.jar'))
dependencies {
    implementation files(powerJar)
    implementation 'zone.moddev.mc.basemetals:BaseMetals:4.0.1.121012+Neo'
    implementation 'zone.moddev.mc.lib:mmdlib:2.0.2.121012+Neo'
    implementation 'zone.moddev.mc.orespawn:OreSpawn:4.1.1.121012'
    runnerImplementation 'com.google.code.gson:gson:2.8.0'
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
neoForge {
    version = '21.1.265'
    mods { advantageworkstest { sourceSet sourceSets.main } }
    unitTest { enable(); testedMod = mods.advantageworkstest }
}
neoForge.addModdingDependenciesTo(sourceSets.test)

tasks.named('test', Test) {
    useJUnitPlatform()
    maxHeapSize = '2G'
    maxParallelForks = 1
    systemProperty 'advantage.test.projectDir', projectDir.absolutePath
    jvmArgs '-XX:ActiveProcessorCount=4'
    testLogging { events 'failed'; exceptionFormat = 'short' }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs','1000'])
}
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }

tasks.named('clean', Delete) {
    doFirst {
        File expected = layout.projectDirectory.dir('build/gradle').asFile.canonicalFile
        if (targetFiles.files.any { it.canonicalFile != expected })
            throw new GradleException('Refusing to clean outside the isolated harness compiler output')
    }
}

tasks.named('processRunnerResources') {
    from('src/main/resources') { include 'assets/advantageworkstest/works/flat-generator.json' }
}
tasks.named('processResources') {
    inputs.property('version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.named('jar', Jar) {
    inputs.file(powerJar)
    manifest.attributes('Implementation-Version': project.version, 'Built-On': '1.21.1-NeoForge-21.1.265',
            'Power-Input-Status': 'EXPLORATORY_UNQUALIFIED',
            'Power-Input-SHA256': MessageDigest.getInstance('SHA-256').digest(powerJar.bytes).encodeHex().toString().toUpperCase(Locale.ROOT))
}
tasks.register('runnerJar', Jar) {
    dependsOn tasks.named('runnerClasses')
    archiveClassifier = 'runner'
    from sourceSets.runner.output
    manifest.attributes('Main-Class': 'zone.moddev.mc.advantageworks.runner.WorksRunner')
}
tasks.named('assemble') { dependsOn tasks.named('runnerJar') }
